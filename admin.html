<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Fendy Store</title><link rel="stylesheet" href="style.css"></head><body class="admin"><header><a href="index.html">← Kembali ke toko</a></header><div class="adminTitle"><h1>Dashboard Admin</h1><span class="hint">Fendy Freelance Store · Control Center</span></div>
<div id="login" class="panel"><h2>Login admin</h2><div class="adminGrid"><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label></div><p><button id="loginBtn" class="primary">Masuk ke dashboard</button></p><p id="loginMsg"></p></div>
<div id="dashboard" hidden><div class="panel"><div class="tabs"><button data-tab="products" class="active">Produk</button><button data-tab="categories">Kategori</button><button data-tab="brands">Brand</button><button data-tab="orders">Pesanan</button></div><p><button id="logout" class="secondary">Keluar</button></p></div>
<section id="tab-products" class="panel"><h2>Kelola Produk</h2><input id="pId" type="hidden"><div class="adminGrid"><label>Nama produk<input id="pName"></label><label>Slug / link<input id="pSlug" placeholder="Otomatis dari nama"></label><label>Harga<input id="pPrice" type="number" min="0"></label><label>Harga promo<input id="pPromo" type="number" min="0"></label><label>Brand<select id="pBrand"></select></label><label>Kategori<select id="pCategory"></select></label><label>Upload foto produk<input id="pImage" type="file" accept="image/*"></label><label>Status<select id="pStatus"><option value="dijual">Dijual</option><option value="tidak dijual">Tidak dijual</option><option value="habis">Habis</option></select></label><label>Stok<input id="pStock" type="number"></label><label>Bonus<input id="pBonus"></label><label>Spesifikasi<textarea id="pSpecs"></textarea></label></div><p><button id="saveProduct" class="primary">Simpan produk</button> <button id="clearProduct" class="secondary">Form baru / kosongkan</button></p><p class="hint">Klik Edit pada daftar produk untuk memperbarui data lama. Foto lama tetap digunakan jika tidak mengunggah foto baru.</p></section>
<section id="tab-categories" class="panel" hidden><h2>Kelola Kategori</h2><input id="cOldId" type="hidden"><div class="adminGrid"><label>ID kategori<input id="cId" placeholder="contoh: gadget"></label><label>Nama kategori<input id="cName"></label><label>Deskripsi<input id="cDesc"></label><label>Upload gambar kategori<input id="cImageFile" type="file" accept="image/*"></label></div><p><button id="saveCategory" class="primary">Simpan kategori</button> <button id="clearCategory" class="secondary">Kategori baru</button></p><div id="categoryRows"></div></section>
<section id="tab-brands" class="panel" hidden><h2>Kelola Brand</h2><input id="bOldId" type="hidden"><div class="adminGrid"><label>ID brand<input id="bId" placeholder="contoh: vivo"></label><label>Nama brand<input id="bName"></label><label>Kategori<select id="bCategory"></select></label><label>Upload gambar brand<input id="bImageFile" type="file" accept="image/*"></label></div><p><button id="saveBrand" class="primary">Simpan brand</button> <button id="clearBrand" class="secondary">Brand baru</button></p><div id="brandRows"></div></section>
<section id="tab-orders" class="panel" hidden><h2>Pesanan masuk</h2><div id="orderRows"></div></section>
<section class="panel"><h3>Daftar Produk</h3><div id="productRows"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
